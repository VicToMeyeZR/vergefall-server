# Ubuntu VPS — Caddy terminates HTTPS on trystarbot.space.
# Nakama/Postgres stay on the docker network. Console is localhost-only.
#
#   docker compose -f docker-compose.vps.yml up -d --build
version: "3.8"
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nakama"]
      interval: 5s
      timeout: 5s
      retries: 8

  nakama:
    build: .
    image: vergefall-nakama:3.21.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_ADDRESS: postgres:${POSTGRES_PASSWORD:-localdev}@postgres:5432/nakama
      SESSION_TOKEN_EXPIRY_SEC: ${SESSION_TOKEN_EXPIRY_SEC:-7200}
      NAKAMA_LOG_LEVEL: ${NAKAMA_LOG_LEVEL:-INFO}
      CONSOLE_PASSWORD: ${CONSOLE_PASSWORD:-localdev}
    ports:
      - "127.0.0.1:7349:7349"
      - "127.0.0.1:7351:7351"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2
    depends_on:
      nakama:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-trystarbot.space}
      CADDY_EMAIL: ${CADDY_EMAIL:-admin@trystarbot.space}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
