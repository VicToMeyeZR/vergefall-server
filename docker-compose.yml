# Vergefall — Nakama 3.21.1 + Postgres 15
# Galaxy sim is a baked Go plugin. Do not enable app-sleep / scale-to-zero:
# rim-1 ticks whether anyone is watching.
#
#   docker compose up --build
version: "3.8"
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: localdev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nakama"]
      interval: 5s
      timeout: 5s
      retries: 8

  nakama:
    build: .
    image: vergefall-nakama:3.21.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_ADDRESS: postgres:localdev@postgres:5432/nakama
      SESSION_TOKEN_EXPIRY_SEC: "7200"
      NAKAMA_LOG_LEVEL: INFO
    ports:
      - "7349:7349"   # gRPC (UE SDK)
      - "7350:7350"   # HTTP + WebSocket (JS SDK, this Helm)
      - "7351:7351"   # console (admin / localdev — change it)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 8

volumes:
  pgdata:
